name: Validate admin panel

on:
  pull_request:
  push:
    branches: [feature/admin-panel-mvp, main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check src/worker.js
          node --check public/admin/admin.js
          node --check public/admin/alta/quick-add.js
          node --check public/app.js
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate catalog
        run: npm run validate
      - name: Verify Wrangler bundle
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
