<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Administrar · Venta de Garage</title><link rel="stylesheet" href="/admin/admin.css"></head><body><header><div><small>VENTA DE GARAGE</small><h1>Administrar productos</h1></div><a href="/" target="_blank" rel="noopener">Ver tienda ↗</a></header><main><aside><div class="heading"><strong>Productos</strong><button id="new" type="button">+ Nuevo</button></div><input id="search" placeholder="Buscar productos..." aria-label="Buscar productos"><p id="count">Cargando…</p><div id="items" class="items"></div></aside><section class="editor"><form id="form"><div class="heading"><h2 id="title">Seleccioná un producto</h2><button id="save" type="submit">Guardar cambios</button></div><p id="status" role="status"></p><div class="fields"><label>ID<input name="id" required pattern="VG-[0-9]{3,5}" placeholder="VG-031"></label><label>Nombre<input name="name" required maxlength="160"></label><label>Categoría<input name="category" required></label><label>Tipo<input name="type"></label><label>Marca<input name="brand"></label><label>Talle<input name="size"></label><label>Color<input name="color"></label><label>Estado<input name="condition"></label><label>Precio en ARS<input name="price" type="number" min="0" step="1" placeholder="Consultar"></label><label>Disponibilidad<select name="availability"><option>Disponible</option><option>Reservado</option><option>Vendido</option></select></label><label>Orden<input name="order" type="number" min="1"></label><label class="check"><input name="publish" type="checkbox" checked> Publicar en la tienda</label><label class="wide">Descripción<textarea name="description" rows="3"></textarea></label></div><section class="photo"><h3>Fotografía principal</h3><img id="preview" alt="Vista previa de fotografía" hidden><input id="photo" type="file" accept="image/jpeg,image/png,image/webp,image/heic" aria-label="Elegir fotografía"><p>La foto se reduce a JPEG y se sube a GitHub. La optimización WebP se realiza automáticamente después. Guardá primero el producto nuevo.</p><button type="button" id="upload">Subir fotografía</button></section></form></section></main><script src="/admin/admin.js" defer></script></body></html>
